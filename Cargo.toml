[package]
name = "meetcal"
version = "1.0.0"
edition = "2024"
description = "CLI for querying MeetCal lifting data"
homepage = "https://github.com/meetcal/meetcal-cli"
repository = "https://github.com/meetcal/meetcal-cli"
license = "MIT"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
comfy-table = "7.2.2"
convex = "0.10.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = "1.52.3"
regex = "1.11"
